name: Compilar KizaTweaks

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Compilar
        run: dotnet build KizaTweaks.sln -c Release

      - name: Pruebas unitarias
        run: dotnet run --project tests/KizaTweaks.Tests -c Release --no-build

      - name: Pruebas de integración (Windows real)
        continue-on-error: true
        run: dotnet run --project tests/KizaTweaks.Tests -c Release --no-build -- --windows

      - name: Descargar medidor de FPS (va incluido en el .exe)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./tools/get-presentmon.ps1

      - name: Publicar .exe (un solo archivo, sin instalar .NET)
        run: dotnet publish src/KizaTweaks.App/KizaTweaks.App.csproj -c Release -o publish

      - name: Prueba de humo de la interfaz (abre todas las páginas)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "publish\KizaTweaks.exe" -ArgumentList "--smoke-test" -PassThru
          if (-not $p.WaitForExit(300000)) { Stop-Process -Id $p.Id -Force; Write-Host "Tiempo agotado" }
          $log = "$env:ProgramData\KizaTweaks\logs"
          if (Test-Path "$log\smoke-test.txt") {
            $txt = Get-Content "$log\smoke-test.txt" -Raw
            Write-Host $txt
            $lvl = if ($p.ExitCode -eq 0) { "notice" } else { "error" }
            Write-Host ("::$lvl title=Prueba de humo::" + ($txt -replace '%','%25' -replace "`r",'' -replace "`n",'%0A'))
          } else { Write-Host "::error title=Prueba de humo::No se generó smoke-test.txt (la app no arrancó o se cerró antes)." }
          $errs = Get-ChildItem "$log\kizatweaks-*.log" -ErrorAction SilentlyContinue | Get-Content | Select-String "\[ERROR\]" | Select-Object -First 15
          if ($errs) { Write-Host ("::warning title=Errores en el log::" + (($errs -join "`n") -replace '%','%25' -replace "`n",'%0A')) }
          Get-ChildItem "$log\kizatweaks-*.log" -ErrorAction SilentlyContinue | Get-Content -Tail 80
          if ($p.ExitCode -ne 0) { Write-Error "La prueba de humo falló (código $($p.ExitCode))"; exit 1 }

      # Para distribución pública, firma el .exe aquí (Azure Trusted Signing, SignPath o certificado propio).
      # Sin firma, Windows SmartScreen mostrará "Editor desconocido" la primera vez.

      - uses: actions/upload-artifact@v4
        with:
          name: KizaTweaks-win-x64
          path: publish/KizaTweaks.exe

      - name: Crear release con el .exe
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('KizaTweaks {0}', github.ref_name) || format('KizaTweaks 1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: publish/KizaTweaks.exe
          make_latest: true
          generate_release_notes: true
